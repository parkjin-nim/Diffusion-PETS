model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 128
    feature_size: 28
    n_layer_enc: 3
    n_layer_dec: 3
    d_model: 64
    timesteps: 500
    sampling_timesteps: 500
    loss_type: l1
    beta_schedule: cosine
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0
    configs:
      top_k: 7
      d_ff: 128
      num_kernels: 3
      k_mask_temperature: 1.0
      period_weight_temperature: 1.0
      timesblock_residual_mode: single
      period_candidate_scope: sample_wise
      period_fft_source: history
      period_fft_history_length: 64
solver:
  base_lr: 1.0e-05
  max_epochs: 18000
  results_folder: /tmp/diffusion-pets-public-r2.xUlGLR/PETS-F/artifacts/paper_main/Energy/seed_0/checkpoints
  gradient_accumulate_every: 2
  save_cycle: 3000
  checkpoint_name_by_step: true
  ema:
    decay: 0.995
    update_interval: 10
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-06
      threshold: 0.0001
      threshold_mode: rel
      warmup_lr: 0.0001
      warmup: 500
      verbose: false
dataloader:
  batch_size: 128
  sample_size: 64
  shuffle: true
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: energy
      proportion: 1.0
      data_root: /tmp/diffusion-pets-public-r2.xUlGLR/PETS-F/data/Energy/final_train.csv
      window: 128
      save2npy: false
      neg_one_to_one: true
      seed: 0
      period: train
  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: energy
      proportion: 0.0
      data_root: /tmp/diffusion-pets-public-r2.xUlGLR/PETS-F/data/Energy/final_test_with_context64.csv
      scaler_data_root: /tmp/diffusion-pets-public-r2.xUlGLR/PETS-F/data/Energy/final_train.csv
      window: 128
      save2npy: false
      neg_one_to_one: true
      seed: 0
      period: test
      style: separate
      distribution: geometric
    coefficient: 0.01
    step_size: 0.05
    sampling_steps: 200
fft_ablation:
  variant: SH64
  seed: 0
experiment:
  marker: PETS_F_FINAL_R2
  history: 64
  forecast: 64
  complete_window_training: true
  future_used_for_period_bank: false
