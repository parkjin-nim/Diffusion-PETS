model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 128
    feature_size: 28
    n_layer_enc: 3
    n_layer_dec: 3
    d_model: 64 #96  # 4 X 24
    timesteps: 500 #1000
    sampling_timesteps: 500 #1000
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0
    configs:
      top_k: 7
      d_ff: 128
      num_kernels: 3

solver:
  base_lr: 1.0e-5
  max_epochs: 25000
  results_folder: ./Checkpoints/energy
  gradient_accumulate_every: 2
  save_cycle: 2500  # max_epochs // 10
  ema:
    decay: 0.995
    update_interval: 10
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 5000
      min_lr: 1.0e-6
      threshold: 1.0e-4
      threshold_mode: rel
      warmup_lr: 1.0e-4
      warmup: 500 
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: energy
      proportion: 1.0  # Set to rate < 1 if training conditional generation
      data_root: ./Data/datasets/energy_data.csv
      window: 128  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: energy
      proportion: 0.9  # rate
      data_root: ./Data/datasets/energy_data.csv
      window: 128  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: test
      style: separate
      distribution: geometric
    coefficient: 1.0e-2
    step_size: 5.0e-2
    sampling_steps: 250

  batch_size: 128
  sample_size: 256
  shuffle: True